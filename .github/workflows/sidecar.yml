name: sidecar

# The automation sidecar's image (sidecar/Containerfile), published for the installer to pull:
# ghcr.io/einhq/automation:main is main as of the last build, :sha-<commit> each commit built. Built
# when a push to main changes sidecar/, and at once when run by hand.
on:
  push:
    branches: [main]
    paths: ['sidecar/**', '.github/workflows/sidecar.yml']
  workflow_dispatch:

concurrency:
  group: sidecar
  cancel-in-progress: false

jobs:
  image:
    # GitHub alone publishes: a Forgejo that runs this repository's workflows has no use for it.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: sha
        run: echo "sha=$(git rev-parse --short=9 HEAD)" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: sidecar
          file: sidecar/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/automation:main
            ghcr.io/${{ github.repository_owner }}/automation:sha-${{ steps.sha.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=The Automation module's sidecar for EiN: an MQTT broker, a listener for devices on the network and a restreamer for cameras, run by compose from ein/deploy
